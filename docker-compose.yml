# =============================================================================
# Media Stack: qBittorrent + Prowlarr + Radarr + Sonarr + Seerr
# =============================================================================
# Directory structure expected on host:
#   /media/
#   ├── torrents/          # qBittorrent download location
#   ├── movies/            # Radarr-managed movies
#   └── series/            # Sonarr-managed series
#
#   /config/
#   ├── qbittorrent/
#   ├── prowlarr/
#   ├── radarr/
#   ├── sonarr/
#   └── seerr/
#
# Ports:
#   qBittorrent WebUI  → http://localhost:8080
#   Prowlarr           → http://localhost:9696
#   Radarr             → http://localhost:7878
#   Sonarr             → http://localhost:8989
#   Seerr              → http://localhost:5055
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # qBittorrent — torrent client
  # ---------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Sofia}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${CONFIG_DIR:-/config}/qbittorrent:/config
      - /media/torrents:/media/torrents
    ports:
      - 8080:8080
      - 6881:6881/tcp
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - media_net

  # ---------------------------------------------------------------------------
  # Prowlarr — indexer manager
  # ---------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Sofia}
    volumes:
      - ${CONFIG_DIR:-/config}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - media_net

  # ---------------------------------------------------------------------------
  # Radarr — movie manager
  # ---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Sofia}
    volumes:
      - ${CONFIG_DIR:-/config}/radarr:/config
      - /media:/media
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - media_net
    depends_on:
      - qbittorrent
      - prowlarr

  # ---------------------------------------------------------------------------
  # Sonarr — TV series manager
  # ---------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Sofia}
    volumes:
      - ${CONFIG_DIR:-/config}/sonarr:/config
      - /media:/media
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media_net
    depends_on:
      - qbittorrent
      - prowlarr

  # ---------------------------------------------------------------------------
  # Seerr — unified media request manager (Plex + Jellyfin + Emby)
  #         successor to Overseerr & Jellyseerr (merged Feb 2026)
  # ---------------------------------------------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Europe/Sofia}
      - PORT=5055
    volumes:
      - ${CONFIG_DIR:-/config}/seerr:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - media_net
    depends_on:
      - radarr
      - sonarr

  # ---------------------------------------------------------------------------
  # Bazarr — subtitle manager for Radarr & Sonarr
  # ---------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Sofia}
    volumes:
      - ${CONFIG_DIR:-/config}/bazarr:/config
      - /media:/media
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media_net
    depends_on:
      - radarr
      - sonarr
      
  # ---------------------------------------------------------------------------
  # Flaresolverr — proxy for Prowlarr indexers
  # ---------------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Sofia}
    ports:
      - "8191:8191"
    networks:
      - media_net
    restart: unless-stopped

# ---------------------------------------------------------------------------
  # Maintainerr — rules-based media cleanup (deletes watched media)
  # ---------------------------------------------------------------------------
  maintainerr:
    image: jorenn92/maintainerr:latest
    container_name: maintainerr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Sofia}
    volumes:
      - ${CONFIG_DIR:-/config}/maintainerr:/opt/data
    ports:
      - 6246:6246
    restart: unless-stopped
    networks:
      - media_net
    depends_on:
      - radarr
      - sonarr

# =============================================================================
# Networks
# =============================================================================
networks:
  media_net:
    driver: bridge
    name: media_net
